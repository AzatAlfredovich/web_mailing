{% extends "newsletter/base.html" %}
{% load my_tags %}

{% block create_button %}
<a class="btn btn-primary" href="{% url 'newsletter:message_create' %}" role="button">Создать сообщение</a>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row text-center">
        {% for message in object_list%}
        <div class="col-6">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ message.subject }}</h4>
                </div>
                <div class="card-body">
                    <h6 class="card-title pricing-card-title mb-3">{{ message.body | truncatechars:100 }}</h6>
                    <div class="buttons-container d-flex flex-column w-100">
                        <a class="btn btn-md btn-outline-success full-width-btn mb-3" href="{% url 'newsletter:message_detail' message.pk %}">Посмотреть</a>
                        <a class="btn btn-md btn-outline-primary full-width-btn mb-3" href="{% url 'newsletter:message_update' message.pk %}">Редактировать</a>
                        <a class="btn btn-md btn-outline-danger full-width-btn mb-3" href="{% url 'newsletter:message_delete' message.pk %}">Удалить</a>
                     </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock%}
