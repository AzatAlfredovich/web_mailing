{% extends "newsletter/base.html" %}

{% block create_button %}
    <a class="btn btn-danger" href="{% url 'users:password_recovery' %}" role="button">Забыли пароль?</a>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row text-start">
        <div class="col-6 mx-auto">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card mb-4 box-shadow">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                        <button type="submit" class="btn btn-lg btn-block btn-outline-success mb-3">Войти</button>
                </div>
            </form>
        </div>
    </div>
{% endblock%}
